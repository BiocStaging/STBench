
# Build STBench website with executable vignettes

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install package and vignette dependencies
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            local::.
            bioc::SpaNorm
            bioc::nnSVG
            bioc::Banksy
            bioc::org.Mm.eg.db
            cran::clevr
            cran::aricode
            bioc::sparseMatrixStats
            github::jinworks/CellChat
            github::immunogenomics/presto
          dependencies: '"hard"'

      # Verify all vignette packages before building
      - name: Check vignette dependencies
        shell: Rscript {0}
        run: |
          packages <- c(
            "SpaNorm",
            "nnSVG",
            "Banksy",
            "org.Mm.eg.db",
            "clevr",
            "aricode",
            "CellChat",
            "presto"
          )

          missing <- packages[
            !vapply(
              packages,
              requireNamespace,
              logical(1),
              quietly = TRUE
            )
          ]

          if (length(missing) > 0) {
            stop(
              "Missing packages: ",
              paste(missing, collapse = ", ")
            )
          }

          message("All vignette dependencies available.")

      # Execute vignettes and generate figures
      - name: Build complete website
        shell: Rscript {0}
        run: |
          pkgdown::build_site_github_pages(
            new_process = FALSE,
            install = FALSE
          )

      # Publish website
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f
        with:
          clean: false
          branch: gh-pages
          folder: docs
